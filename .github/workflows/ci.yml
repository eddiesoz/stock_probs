# M06 CI fails closed across pinned quality, API/security/restore, and browser/a11y gates.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Commit pins prevent mutable marketplace tags from changing a release gate silently.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install pinned Python environment
        run: make setup
      - name: Run lint, type, unit, API, security, migration, and restore gates
        run: make check
      - name: Enforce intent-bearing implementation comments
        run: .dev-venv/bin/python scripts/comment_audit.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: M06-python-${{ github.sha }}
          path: test-results/python
          if-no-files-found: error
          retention-days: 7

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install pinned app
        run: make setup
      - name: Install pinned Node, packages, Chromium, and Linux libraries
        run: make browser-install
      - name: Smoke official headless isolated Playwright MCP
        run: make mcp-smoke
      - name: Run serial desktop/mobile browser and accessibility regressions
        run: make browser-test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: M06-browser-${{ github.sha }}
          path: |
            tools/browser/test-results
            tools/browser/playwright-report
          if-no-files-found: error
          retention-days: 7
